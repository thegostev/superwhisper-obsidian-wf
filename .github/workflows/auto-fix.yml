name: Auto-fix bot

on:
  schedule:
    # Every Sunday at 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-fix:
    name: Run ruff/mypy auto-fixes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff auto-fix and format
        run: |
          ruff check . --fix --exit-zero
          ruff format .

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/auto-fix-${{ github.run_id }}
          delete-branch: true
          title: "chore: auto-fix lint and formatting"
          body: |
            This PR was generated automatically by the auto-fix bot.

            Changes:
            - Applied `ruff check . --fix`
            - Applied `ruff format .`

            If CI passes, this PR can be merged safely.
          commit-message: "chore: auto-fix lint and formatting"
          labels: |
            automated
            maintenance
