# RecordingAnalyser Configuration
# Copy this file to config.yaml and fill in your values.

# ── Superwhisper integration ───────────────────────────────────────────────
# Mode key: find in ~/Documents/superwhisper/modes (filename without extension)
superwhisper_mode_key: "meeting"
superwhisper_timeout: 3600           # seconds to wait for result before giving up
superwhisper_recordings_dir: "~/Documents/superwhisper/recordings"
superwhisper_poll_interval: 3        # seconds between polls while waiting

# ── Custom Mode prompt (reference only — paste into Superwhisper UI) ───────
# Go to Superwhisper > Settings > Custom Mode > Prompt and set:
#
# The User Message is the raw transcription of the audio.
# Output EXACTLY the following structure, with no preamble or extra text:
#
# ---CATEGORY---
# <one of: MUSIKKERE | MINNESOTERE | PERSONLIG | INTERVJUER | DEFAULT>
# ---FILENAME---
# <meeting title — no date, no .md extension, no slashes>
# ---ANALYSIS---
# <full analysis in Markdown>

# ── Watch folder ───────────────────────────────────────────────────────────
# Where Just Press Record saves audio files.
# Audio is expected in date-based subfolders: YYYY-MM-DD/*.m4a
watch_folder: "~/Library/Mobile Documents/iCloud~com~openplanetsoftware~just-press-record/Documents"

# ── Output folders ─────────────────────────────────────────────────────────
# Map category names to exact output folder paths.
# Files land directly here — no subfolder is appended by the code.
folders:
  MUSIKKERE: "~/Library/Mobile Documents/iCloud~md~obsidian/Documents/Musikkere - Obsidian/Meetings"
  MINNESOTERE: "~/Library/Mobile Documents/iCloud~md~obsidian/Documents/Minnesotere - Obsidian/3 - Meetings"
  PERSONLIG: "~/Library/Mobile Documents/iCloud~md~obsidian/Documents/Personlig - Obsidian/Meetings"
  INTERVJUER: "~/Library/Mobile Documents/iCloud~md~obsidian/Documents/Personlig - Obsidian/Intervjuer"
  DEFAULT: "~/Library/Mobile Documents/iCloud~md~obsidian/Documents/Personlig - Obsidian/Meetings"

# ── State tracking ─────────────────────────────────────────────────────────
state_file: "~/.meeting_transcriber_state.json"
failed_analysis_log: "failed_analysis.log"

# ── Service behavior ───────────────────────────────────────────────────────
scan_interval: 30           # seconds between scan cycles
scan_days_back: 7           # how many days of recordings to scan
delay_between_files: 5      # seconds between files (Superwhisper is local, no API rate limit)
max_retries: 3
max_files_per_cycle: 5
retry_backoff: [10, 30, 60]
