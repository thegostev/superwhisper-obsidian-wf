[project]
name = "meeting-transcriber"
version = "0.1.0"
description = "Automated audio transcription and analysis via Superwhisper"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
]

[tool.setuptools]
py-modules = ["auto_transcribe", "reclassify_and_fix", "ondemand_transcribe", "pipeline", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services",
]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# `ruff format` is the single source of truth for layout. These three checks are
# intentionally disabled because they conflict with that authority and with this
# repo's deliberately terse style, and they have no autofix — so they can only be
# "fixed" by un-collapsing code, which the refactor bot immediately re-collapses:
#   E501  long lines  — `ruff format` never splits string literals, so a wrapped
#                       long f-string still trips E501; check and format would
#                       permanently disagree. Format still wraps long *code* at
#                       line-length, so real layout stays bounded.
#   E701  `if x: return`        one-liners — deliberate terse style.
#   E702  `a; b` on one line    one-liners — deliberate terse style.
# Everything else in E/F/W/I (real bugs, unused imports, import order, whitespace)
# is kept and is auto-fixable, so `ruff check --fix` + `ruff format` always converge.
ignore = ["E501", "E701", "E702"]

[tool.mypy]
python_version = "3.13"
# warn_return_any is intentionally OFF: the refactor bot inlines typed temp vars
# before `return` (e.g. `return json.loads(...).get(x)`), which re-exposes `Any`
# returns on every run. This rule is in permanent conflict with that and has no
# stable fix. mypy still catches real type errors (bad args, undefined attrs, etc.).
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["utils/"]
