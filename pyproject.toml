[project]
name = "meeting-transcriber"
version = "0.1.0"
description = "Automated audio transcription and analysis via Superwhisper"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
]

[tool.setuptools]
py-modules = ["auto_transcribe", "reclassify_and_fix", "ondemand_transcribe", "pipeline", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services",
]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# This codebase deliberately favours compact, single-line constructs:
# grouped imports (`import json, re, time`), collapsed `except X: pass`,
# and single-line raise/print calls. Those choices are intentional and are
# incompatible with ruff's import sorting (I) and the E4/E5/E7 style rules,
# so they are disabled here. What remains catches real defects — F (pyflakes:
# undefined names, unused imports/vars) and the non-stylistic E/W checks —
# which keeps `ruff check` a meaningful, green-able gate instead of permanent
# style noise. Formatting is owned by the author, not enforced in CI; see
# the note in .github/workflows/tests.yml.
select = ["E", "F", "W"]
ignore = ["E401", "E501", "E701", "E702"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["utils/"]
