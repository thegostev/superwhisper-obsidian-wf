repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML, pytest]
        args: [--ignore-missing-imports]

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest-fast
        entry: python -m pytest tests/ -m "not slow and not integration"
        language: system
        pass_filenames: false
        always_run: true
